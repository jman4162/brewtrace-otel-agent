# --- weak (balanced) ---------------------------------------------------------
- id: weak-balanced-v60
  input: "15g/260g v60, 94C, 3:00, weak and watery but nothing tastes bad"
  expected_defect: weak
  acceptable:
    - { variable: ratio, direction: decrease }
  notes: "strength problem, not extraction: must NOT touch grind"

- id: weak-kalita
  input: "18g/300g kalita, 93C, 3:30, watery"
  expected_defect: weak
  acceptable:
    - { variable: ratio, direction: decrease }

- id: weak-fast-drawdown
  input: "16g/250g v60, 94C, 2:00 drawdown, weak"
  expected_defect: weak
  acceptable:
    - { variable: grind, direction: finer }
  notes: "fast drawdown + weak: channeling, fast-drawdown rules take over"

