    - { variable: grind, direction: coarser }

- id: astringent-only-kalita
  input: "21g/320g kalita, 94C, 4:10, really astringent"
  expected_defect: bitter_astringent
  acceptable:
    - { variable: grind, direction: coarser }

# --- bitter ------------------------------------------------------------------
- id: bitter-v60
  input: "16g/250g v60, 96C, 3:15, harsh and bitter"
  expected_defect: bitter
  acceptable:
    - { variable: grind, direction: coarser }

- id: bitter-at-temp-floor
