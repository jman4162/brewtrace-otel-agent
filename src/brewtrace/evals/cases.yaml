# BrewTrace evaluation cases.
#
# Each case: free-text brew description, the defect the parser should find,
# and the set of (variable, direction) adjustments that count as a pass.
# The deterministic pipeline must score 100% on these by construction —
# a failure means either the rule table or the case itself is wrong.

# --- sour_thin ---------------------------------------------------------------
- id: sour-thin-v60-basic
  input: "16g/250g V60, 94C, 3:45 drawdown, tastes sour and thin"
  expected_defect: sour_thin
  acceptable:
    - { variable: grind, direction: finer }
  notes: "3:45 is in range for V60; finer grind is the first-choice fix"

- id: sour-thin-kalita
  input: "20g coffee / 310g water kalita, 93C, 4:00, sour and thin"
  expected_defect: sour_thin
  acceptable:
    - { variable: grind, direction: finer }

- id: sour-thin-no-timing
  input: "16g/250g v60 at 94C, thin and sour"
  expected_defect: sour_thin
  acceptable:
    - { variable: grind, direction: finer }
  notes: "missing drawdown: recommendation stands but confidence drops to medium"

# --- sour_thin guard interactions (the showcase) -----------------------------
- id: sour-thin-stalled-flips-to-temp
  input: "16g/250g V60, 92C, 5:00 drawdown, sour and thin"
  expected_defect: sour_thin
  acceptable:
    - { variable: temperature, direction: increase }
  notes: "drawdown 5:00 is slow/stalled; finer grind is contraindicated"

- id: sour-thin-stalled-temp-maxed-falls-to-bloom
  input: "16g/250g V60, 96C, 5:15 drawdown, sour and thin"
  expected_defect: sour_thin
  acceptable:
    - { variable: bloom, direction: increase }
  notes: "both grind (stall) and temperature (ceiling) are contraindicated"

# --- sour --------------------------------------------------------------------
- id: sour-v60
  input: "15g/250g v60, 94C, 3:00, came out sour"
  expected_defect: sour
  acceptable:
    - { variable: grind, direction: finer }

- id: sour-fast-drawdown
  input: "16g/250g v60, 94C, 1:45 drawdown, sour"
  expected_defect: sour
  acceptable:
    - { variable: grind, direction: finer }
  notes: "fast drawdown + sour: grind finer via the fast-drawdown rules"

- id: sour-clever
  input: "18g/280g clever, 92C, 1:30 drainage, tart and sour"
  expected_defect: sour
  acceptable:
    - { variable: grind, direction: finer }

# --- bitter_astringent -------------------------------------------------------
- id: bitter-astringent-v60
  input: "16g/250g v60, 95C, 3:30, bitter with a drying astringent finish"
