# --- balanced ----------------------------------------------------------------
- id: balanced-keep
  input: "16g/250g v60, 94C, 3:00, tastes great"
  expected_defect: balanced
  acceptable:
    - { variable: none, direction: keep }
  notes: "a balanced brew gets no change: repeat for a stable baseline"

# --- drawdown-only cases (no taste defect) -----------------------------------
- id: stalled-no-defect
  input: "16g/250g v60, 94C, 5:30 drawdown"
  expected_defect: null
  acceptable:
    - { variable: grind, direction: coarser }

- id: fast-no-defect
  input: "16g/250g v60, 94C, 1:50 drawdown"
  expected_defect: null
  acceptable:
